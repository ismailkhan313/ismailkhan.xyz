name: Sync notes from tech-llm-wiki

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: "sync-wiki"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone tech-llm-wiki
        run: git clone --depth 1 https://github.com/ismailkhan313/tech-llm-wiki.git /tmp/tech-llm-wiki

      - name: Mirror into content/Wiki
        run: |
          mkdir -p content/Wiki
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='.claude' \
            --exclude='CLAUDE.md' \
            --exclude='README.md' \
            --exclude='references' \
            --exclude='log.md' \
            /tmp/tech-llm-wiki/ content/Wiki/

      - name: Publish the log at /log as "Wiki Log"
        run: |
          awk '
            NR == 1 && $0 == "---" { in_fm = 1; print; next }
            in_fm && /^---[[:space:]]*$/ { in_fm = 0; print; next }
            in_fm && /^title:/ { print "title: Wiki Log"; next }
            !in_fm && !h1 && /^# / { print "# Wiki Log"; h1 = 1; next }
            { print }
          ' /tmp/tech-llm-wiki/log.md > content/log.md

      - name: Commit and push if changed
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/Wiki content/log.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            SHA=$(git -C /tmp/tech-llm-wiki rev-parse --short HEAD)
            git commit -m "Sync notes from tech-llm-wiki@${SHA}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yaml
